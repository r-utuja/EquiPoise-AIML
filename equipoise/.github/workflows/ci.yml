name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Ruff
        run: ruff check .

      - name: Pytest (synthetic data only; includes API and app smoke tests)
        run: pytest

  docker:
    # Build (never push) the API and app images. The images hold code, config and
    # aggregate reports only: models are mounted at run time and data is never copied.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t equipoise-api:ci .

      - name: Build app image
        run: docker build -f docker/Dockerfile.app -t equipoise-app:ci .

      - name: Validate compose file
        run: docker compose -f docker/docker-compose.yml config --quiet
