[browser]
gatherUsageStats = false

[server]
headless = true

# One calm accent, neutral surfaces, readable sizes. Light by default; the dark variant
# keeps the same accent so drug colours and charts still read well.
[theme]
baseFontSize = 16
baseRadius = "0.6rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#1f6fb2"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f2f0"
textColor = "#1d1d1b"

[theme.dark]
primaryColor = "#5aa2e0"
backgroundColor = "#141517"
secondaryBackgroundColor = "#202226"
textColor = "#ececea"
