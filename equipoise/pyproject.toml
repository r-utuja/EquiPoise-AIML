[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equipoise"
version = "0.1.0"
description = "Explainable, cost-aware treatment-choice assistant for diabetic macular edema, learned from DRCR Protocol T (research prototype, not for clinical use)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Equipoise student team" }]
dependencies = [
    # data + numerics
    "numpy>=1.26",
    "pandas>=2.2",           # 2.2+ and 3.x supported (Colab ships 2.2; AutoGluon pins <3)
    "scipy>=1.11",
    "pyyaml>=6.0",
    "tabulate>=0.9",          # DataFrame.to_markdown for report tables
    # modelling
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "mlxtend>=0.23",          # Apriori / association rules (M3)
    "econml>=0.15",           # meta-learners, causal forest (M6)
    "torch>=2.2",             # TARNet (M6)
    "optuna>=3.6",            # hyperparameter search (M6)
    "hmmlearn>=0.3",          # HMM reference implementation (M7)
    "scikit-fuzzy>=0.5",      # fuzzy inference (M8)
    "shap>=0.45",             # explainability (M9)
    "networkx>=3.2",          # causal DAG drawing (docs)
    # plotting
    "matplotlib>=3.8",
    # engineering
    "typer>=0.12",
    "pydantic>=2.6",
    "joblib>=1.3",
    "mlflow>=2.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",            # FastAPI TestClient
    "dvc>=3.50",
]
app = [
    "streamlit>=1.40",        # st.navigation, bordered/horizontal containers
    "altair>=5.0",            # main-flow charts
    "fpdf2>=2.7",             # one-page patient summary PDF
    "evidently>=0.4",
    "requests>=2.31",
]
ui-dev = [                    # dev only (not in requirements-app.txt or Docker images)
    "playwright>=1.40",       # scripts/ui_screenshots.py; then `python -m playwright install chromium`
]
automl = [
    "autogluon.tabular>=1.1",
]
cv = [
    "opencv-python-headless>=4.9",
    "torchvision>=0.17",
    "ultralytics>=8.2",
    "grad-cam>=1.5",
    "gradio>=4.26",
    "kaggle>=1.6",
]

[project.scripts]
equipoise = "equipoise.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equipoise = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
# build_protocolT_table.py is the frozen M0 script: not reformatted, by design.
extend-exclude = ["notebooks", "scripts/build_protocolT_table.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # so tests can import the Streamlit app package (app/)
addopts = "-ra"
filterwarnings = [
    "ignore:X does not have valid feature names:UserWarning",
    "ignore::PendingDeprecationWarning:shap.*",
    # inside scikit-fuzzy (np.maximum with 3 positional args); not our code
    "ignore:Passing more than 2 positional arguments to np.maximum:DeprecationWarning",
    # our adfuller call unpacks (stat, p, *rest), which works with either return type
    "ignore:adfuller currently returns a plain tuple:FutureWarning",
    # recommend() falls back to DEMO prices on purpose in tests
    "ignore:DEMO prices in use:UserWarning",
    "ignore::DeprecationWarning:mlflow.*",
    "ignore::FutureWarning:mlflow.*",
    # starlette's TestClient still wraps httpx; harmless in tests
    "ignore:Using `httpx` with `starlette.testclient`",
]
